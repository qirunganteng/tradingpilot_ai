name: Android CI - Build, Test & Release
on:
  push:
    branches: ["main", "develop"]
    paths: ["TradePilotAI/**"]
  pull_request:
    branches: ["main", "develop"]
    paths: ["TradePilotAI/**"]
defaults:
  run:
    working-directory: TradePilotAI/android-client
permissions:
  contents: write
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle Wrapper (jika belum ada)
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew belum ada, generate dengan Gradle bawaan runner..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          else
            echo "gradlew sudah ada, skip generate."
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit test (domain & data layer)
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: TradePilotAI/android-client/app/build/outputs/apk/debug/*.apk
      - name: Publish ke Release "latest" (URL download tetap, auto ke-update)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (auto-updated tiap push ke main)"
          body: |
            Build otomatis dari commit ${{ github.sha }}. File di release ini SELALU
            ditimpa versi terbaru -- bookmark link download-nya, tidak perlu buka
            Actions/cari run baru tiap mau update.
          prerelease: true
          files: TradePilotAI/android-client/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-release:
    needs: build-debug
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle Wrapper (jika belum ada)
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew belum ada, generate dengan Gradle bawaan runner..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          else
            echo "gradlew sudah ada, skip generate."
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Cek signing secret tersedia
        id: check_secrets
        run: |
          if [ -n "${{ secrets.RELEASE_STORE_FILE_BASE64 }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Siapkan keystore dari secret
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: echo "${{ secrets.RELEASE_STORE_FILE_BASE64 }}" | base64 -d > tradepilot-release.jks
      - name: Tulis keystore.properties dari secret
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          cat > keystore.properties << PROPS
          RELEASE_STORE_FILE=tradepilot-release.jks
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          PROPS
      - name: Assemble release APK (signed)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: ./gradlew :app:assembleRelease
      - name: Upload release APK
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: TradePilotAI/android-client/app/build/outputs/apk/release/*.apk
      - name: Publish APK release ke Release "latest"
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (auto-updated tiap push ke main)"
          prerelease: true
          files: TradePilotAI/android-client/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lewati build release (secret belum diisi)
        if: steps.check_secrets.outputs.has_secrets == 'false'
        run: echo "RELEASE_STORE_FILE_BASE64 belum diisi di GitHub Secrets — lihat docs/DEPLOY.md Bagian C.1. Build release dilewati, hanya APK debug yang tersedia."
