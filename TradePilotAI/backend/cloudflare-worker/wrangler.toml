name = "tradepilot-ai-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "tradepilot_db"
database_id = "5617dfd6-8b08-42bf-8d78-50d58bf2f1f5"

[[r2_buckets]]
binding = "CHART_BUCKET"
bucket_name = "tradepilot-charts"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "144db6fc267b4f93a9b805417b42e253"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"
CLAUDE_MODEL = "claude-sonnet-4-6"
OPENAI_MODEL = "gpt-4o-mini"
DEEPSEEK_MODEL = "deepseek-chat"
QWEN_MODEL = "qwen-plus"
ENVIRONMENT = "development"

# Secrets (NOT stored here -- set via `wrangler secret put <NAME>`):
#   GEMINI_API_KEY       (required -- already in use)
#   GATEWAY_AUTH_TOKEN   (required -- already in use)
#   ANTHROPIC_API_KEY    (optional -- enables the Claude provider)
#   OPENAI_API_KEY       (optional -- enables the OpenAI provider)
#   DEEPSEEK_API_KEY     (optional -- enables the DeepSeek provider)
#   QWEN_API_KEY         (optional -- enables the Qwen provider)
# A provider without its key configured returns a clear 503 error from
# /api/v1/chat/stream instead of crashing -- Gemini keeps working either way.
